	<head>
		<title>Epigraph</title>
		<link href="../css/core.css" rel="stylesheet" type="text/css"/>
		<link href="../css/local.css" rel="stylesheet" type="text/css"/>
	</head>
	<body epub:type="frontmatter">
		<section id="epigraph" epub:type="epigraph">
			<blockquote epub:type="z3998:verse">
				<p>
					<span>He, wrapt in clouds of mystery and silence,</span>
					<br/>
					<span>Broods o’er his passions, bodies them in deeds,</span>
					<br/>
					<span>And sends them forth on wings of Fate to others:</span>
					<br/>
					<span>Like the invisible Will, that guides us,</span>
					<br/>
					<span>Unheard, unknown, unsearchable!</span>
				</p>
			</blockquote>
		</section>
	</body>
</html>
