	<head>
		<title>Epigraph</title>
		<link href="../css/core.css" rel="stylesheet" type="text/css"/>
		<link href="../css/local.css" rel="stylesheet" type="text/css"/>
	</head>
	<body epub:type="frontmatter">
		<section id="epigraph" epub:type="epigraph">
			<blockquote>
				<p class="noindent">
					<span class="small">He, wrapt in clouds of mystery and silence,<br/>
					Broods o'er his passions, bodies them in deeds,<br/>
					And sends them forth on wings of Fate to others:<br/>
					Like the invisible Will, that guides us,<br/>
					Unheard, unknown, unsearchable!</span>
				</p>
			</blockquote>
		</section>
	</body>
</html>
